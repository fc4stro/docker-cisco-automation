---
# Variáveis aplicadas a TODOS os hosts.
#
# SEM SECRETS HARDCODED: as credenciais são lidas de variáveis de ambiente
# (injetadas via `.env` no docker-compose) ou de um arquivo ansible-vault.
# Defina no host / .env:
#   ANSIBLE_NET_USERNAME, ANSIBLE_NET_PASSWORD  (e, se usar enable, ANSIBLE_NET_AUTH_PASS)
ansible_user: "{{ lookup('env', 'ANSIBLE_NET_USERNAME') | default('admin', true) }}"
ansible_password: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"

# Conexão de rede padrão (network_cli sobre SSH).
ansible_connection: ansible.netcommon.network_cli

# Tipo de transporte SSH. paramiko é mais tolerante com dispositivos legados.
# Troque para 'libssh' (ansible-pylibssh) se quiser mais desempenho em equipamentos modernos.
ansible_network_cli_ssh_type: paramiko

# Modo enable (descomente se seus dispositivos exigirem privilégio elevado):
# ansible_become: true
# ansible_become_method: enable
# ansible_become_password: "{{ lookup('env', 'ANSIBLE_NET_AUTH_PASS') }}"
