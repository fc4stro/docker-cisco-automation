# Inventário de exemplo — substitua os IPs/hosts pelos do seu lab.
# Credenciais NÃO ficam aqui: veja group_vars/ (variáveis de ambiente / vault).

[ios]
# Cisco IOS clássico
rtr-ios-01     ansible_host=192.168.34.21
rtr-ios-02     ansible_host=192.168.34.230

[iosxe]
# Cisco IOS XE (usa a mesma collection cisco.ios)
sw-iosxe-01    ansible_host=192.0.2.21

[nxos]
# Cisco Nexus / NX-OS
sw-nxos-01     ansible_host=192.168.34.5

# Exemplo de dispositivo LEGADO que exige ciphers/kex antigos.
# O ajuste de algoritmos é feito POR HOST via ansible_ssh_common_args
# (ver group_vars/legacy.yml). Assim, só este host usa SSH enfraquecido.
[legacy]
rtr-legacy-01  ansible_host=192.0.2.41

# Agrupa todos os dispositivos Cisco de rede.
[cisco:children]
ios
iosxe
nxos
legacy
