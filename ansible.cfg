[defaults]
host_key_checking = False
retry_files_enabled = False
inventory = ./inventory/hosts.ini
timeout = 30
interpreter_python = auto_silent
# Caminho das collections instaladas na imagem (ver Dockerfile).
collections_path = /opt/ansible/collections
# Saída mais legível para tarefas de rede.
stdout_callback = yaml

[persistent_connection]
connect_timeout = 60
command_timeout = 60
connect_retry_timeout = 30

[ssh_connection]
# Usa o ssh/config do projeto (algoritmos legados por host, StrictHostKeyChecking no).
# Relevante quando ansible_network_cli_ssh_type=libssh/openssh; com paramiko,
# os algoritmos legados são controlados por ansible_ssh_common_args no inventory.
ssh_args = -F /home/ansible/.ssh/config -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
